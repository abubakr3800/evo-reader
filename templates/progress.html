<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reading your project — evostudy</title>
<style>
  :root{ --sc-red:#eb1b26; --sc-dark-red:#a40e16; --ink:#111; --sub:#6b7280; --border:#e3e5e9; }
  *{box-sizing:border-box}
  body{margin:0;background:#f5f6f8;color:var(--ink);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  main{max-width:600px;margin:90px auto;padding:0 20px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:40px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);text-align:center}
  h1{font-size:18px;margin:0 0 26px}
  .pct{font-size:44px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
  .stage{color:var(--sub);font-size:14px;min-height:20px;margin-bottom:22px}
  .track{background:#eee;border-radius:100px;height:10px;overflow:hidden}
  .fill{background:linear-gradient(90deg,var(--sc-dark-red),var(--sc-red));
    height:100%;width:0%;transition:width .35s ease;border-radius:100px}
  .errbox{margin-top:22px;text-align:left;background:#fdeaea;border:1px solid #f4c6c6;
    color:#8a1a1a;border-radius:8px;padding:14px 16px;font-size:12.5px;
    white-space:pre-wrap;font-family:ui-monospace,monospace;max-height:260px;overflow:auto}
  .hint{color:var(--sub);font-size:12.5px;margin-top:18px}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Reading your project…</h1>
    <div class="pct" id="pct">0%</div>
    <div class="stage" id="stage">Starting…</div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="hint" id="hint">This reflects real steps actually completing — not a simulated bar.</div>
    <div id="errWrap" style="display:none">
      <div class="errbox" id="errBox"></div>
    </div>
  </div>
</main>
<script>
  const jobId = {{ job_id|tojson }};
  const pctEl = document.getElementById('pct');
  const stageEl = document.getElementById('stage');
  const fillEl = document.getElementById('fill');
  const errWrap = document.getElementById('errWrap');
  const errBox = document.getElementById('errBox');

  async function poll() {
    try {
      const r = await fetch(`/status/${jobId}`);
      const s = await r.json();
      if (s.error) {
        errWrap.style.display = 'block';
        errBox.textContent = s.error;
        stageEl.textContent = 'Failed';
        return;
      }
      const pct = s.percent ?? 0;
      pctEl.textContent = Math.round(pct) + '%';
      fillEl.style.width = pct + '%';
      stageEl.textContent = s.stage || '';
      if (s.done) {
        window.location.href = `/result/${jobId}`;
        return;
      }
    } catch (e) { /* transient — keep polling */ }
    setTimeout(poll, 500);
  }
  poll();
</script>
</body>
</html>
